schema_version: '1'
project: iagraphcreation
governance_version: 1.0.0
task_type: CODE
policy_version: 1
objective: >-
  Build IAGraphCreation: a canonical, traceable, revision-aware code and
  architecture graph of related repositories, with Copilot context and a local
  interactive viewer, without depending on Graphify or Archify at runtime.
  Design: MarioGovernance/docs/milestones/G1-IAGRAPH/RFC-G1.md (v3, ratified).
scope:
  allow:
  - src
  - tests/unit
  - tests/fixtures
  - docs/ARCHITECTURE.md
  - docs/MEASUREMENTS.md
  - README.md
  - package.json
  - vitest.config.mjs
  deny:
  # The pinned acceptance is the outcome, not material for the implementer.
  # This is the R-T2-1 hole B0 left open: an attempt with tests/ in its envelope
  # could weaken the assertions it is measured by.
  - tests/acceptance
  - vendor
  - .governance
  - LICENSE
  - docs/API.md
  ignore:
  - node_modules
  - .iagraph
  - graphs
  - package-lock.json
acceptance:
  tests:
    # GOV runs this gate in a THROWAWAY git worktree, which by design has no
    # node_modules: a Python project works there because pytest needs no
    # install, a Node one does not. Installing first is what makes the gate
    # meaningful instead of red from the start. Measured at ~2s with a warm
    # npm cache.
    command: npm ci --no-audit --no-fund --prefer-offline --silent && npx vitest run --reporter=dot
    timeout: 1800.0
    junit: false
  # The artifacts gate is REQUIRED, and a required gate that is SKIPPED
  # escalates to a Human Gate. Declaring an empty list is therefore not
  # neutral - it halts every attempt. These two are real invariants, not gate
  # filler: docs/API.md is the frozen contract the acceptance binds to and is
  # denied to the implementer, so the gate proves it survived intact.
  artifacts:
  - path: docs/API.md
    kind: file
  - path: README.md
    kind: file
providers:
  IMPLEMENTER:
    provider: opencode
    model: opencode-go/deepseek-v4-flash
    timeout_seconds: 3000
  QA:
    provider: opencode
    model: opencode-go/deepseek-v4-flash
    timeout_seconds: 1200
